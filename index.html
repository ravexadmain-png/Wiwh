<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard & Hub</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body {
            background-color: #080c14;
            color: #f3f4f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glow-effect {
            box-shadow: 0 0 25px rgba(99, 102, 241, 0.2);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center p-4 selection:bg-indigo-500 selection:text-white">

    <!-- Top Navigation -->
    <header class="w-full max-w-md mt-4 flex justify-between items-center px-5 py-3.5 glass-panel rounded-2xl shadow-xl">
        <div class="flex items-center space-x-3">
            <div class="w-3.5 h-3.5 bg-indigo-500 rounded-full shadow-[0_0_10px_#6366f1] animate-pulse"></div>
            <span class="font-bold tracking-wider text-base bg-gradient-to-r from-indigo-400 via-purple-400 to-cyan-400 bg-clip-text text-transparent">PORTAL HUB</span>
        </div>
        <div class="flex items-center space-x-2">
            <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
            <span class="text-xs font-medium text-gray-300">Active</span>
        </div>
    </header>

    <!-- Main Content Box -->
    <main class="w-full max-w-md flex flex-col items-center text-center my-auto py-6 space-y-6">
        <div class="glass-panel p-8 rounded-3xl w-full glow-effect relative overflow-hidden">
            <!-- Background Neon Glow Blob -->
            <div class="absolute -top-20 -right-20 w-40 h-40 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>
            <div class="absolute -bottom-20 -left-20 w-40 h-40 bg-cyan-600/20 rounded-full blur-3xl pointer-events-none"></div>

            <div class="w-16 h-16 mx-auto mb-5 rounded-2xl bg-gradient-to-tr from-indigo-600 to-cyan-500 flex items-center justify-center shadow-lg shadow-indigo-500/30">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                </svg>
            </div>

            <h1 class="text-2xl font-bold tracking-tight text-white mb-2">Welcome Back</h1>
            <p class="text-gray-400 text-sm mb-6 leading-relaxed">Access your tools, media feeds, and secure links instantly from one place.</p>
            
            <div class="space-y-3">
                <a href="#" id="primaryBtn" class="w-full py-3.5 px-6 rounded-xl bg-gradient-to-r from-indigo-600 to-cyan-500 hover:from-indigo-500 hover:to-cyan-400 text-white font-semibold shadow-lg shadow-indigo-500/25 transition-all duration-200 block text-center active:scale-95">
                    Explore Content
                </a>
                <a href="#" class="w-full py-3.5 px-6 rounded-xl glass-panel hover:bg-gray-800/80 text-gray-300 font-medium transition-all duration-200 block text-center border border-gray-700/50">
                    View Dashboard
                </a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full max-w-md mb-2 text-center text-xs text-gray-500">
        &copy; 2026 Portal Hub. All rights reserved.
    </footer>

    <!-- Service Worker Script (`sw_2.js` রুট ফোল্ডারে রেজিস্টার করার জন্য) -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('/sw_2.js')
                    .then(function(registration) {
                        console.log('ServiceWorker registration successful with scope: ', registration.scope);
                    })
                    .catch(function(err) {
                        console.log('ServiceWorker registration failed: ', err);
                    });
            });
        }
    </script>
</body>
</html>
